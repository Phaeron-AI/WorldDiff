# pyproject.toml
[project]
name = "worlddiff"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = ["torch", "numpy", "einops"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worlddiff"]

[tool.pytest.ini_options]
pythonpath = ["src"]     # `from worlddiff.data... import ...` resolves in tests, no cwd games
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true