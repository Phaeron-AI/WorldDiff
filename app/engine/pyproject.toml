# pyproject.toml
[project]
name = "worlddiff"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = ["torch", "numpy", "einops"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]       # engine/ on the path, so `from src.data... import ...` resolves
testpaths = ["tests"]
markers = [
  "slow: long-running; deselect with -m 'not slow'",
]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true